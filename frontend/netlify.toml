[build]
  # Base directory for the build
  base = "frontend"
  
  # Build command - Netlify Next.js plugin handles this automatically
  command = "npm install && npm run build"
  
  # Publish directory - Netlify Next.js plugin will handle this
  publish = ".next"

[build.environment]
  # Node version
  NODE_VERSION = "22"
  
  # Next.js build settings
  NEXT_TELEMETRY_DISABLED = "1"
  SKIP_ENV_VALIDATION = "true"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Plugin configuration for Next.js
# This plugin automatically handles Next.js routing, ISR, and API routes
[[plugins]]
  package = "@netlify/plugin-nextjs"
