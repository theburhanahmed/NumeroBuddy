# fly.toml app configuration file generated for numerai-backend on 2024-01-01T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "numerai-backend"
primary_region = "iad"  # US East (Ashburn, Virginia) - change to your preferred region

[build]
  dockerfile = "Dockerfile"
  dockerfile_dir = "."

[env]
  PYTHONUNBUFFERED = "1"
  DJANGO_SETTINGS_MODULE = "numerai.settings.production"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/api/v1/health/"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[processes]
  app = "gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile - numerai.wsgi:application"
  worker = "celery -A numerai worker --loglevel=info --concurrency=2"
  beat = "celery -A numerai beat --loglevel=info"

# For Celery Worker (separate machine)
# Create with: fly scale count worker=1 --process-group worker
# fly scale count beat=1 --process-group beat

# Static files are handled by WhiteNoise middleware in Django
# If you need Fly.io to serve static files directly, uncomment:
# [[statics]]
#   guest_path = "/app/staticfiles"
#   url_prefix = "/static/"
